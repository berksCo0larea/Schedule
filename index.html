<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Break</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI, sans-serif;
    color:white;
}

.container{
    text-align:center;
}

.gear-system{
    position:relative;
    width:220px;
    height:170px;
    margin:auto;
}

/* MAIN GEAR */
.gear{
    position:absolute;
    border-radius:50%;
    background:
        radial-gradient(circle at center,
            #d1d5db 0 15%,
            #374151 15% 35%,
            #9ca3af 35% 65%,
            #4b5563 65% 100%);
    box-shadow:
        0 0 20px rgba(255,255,255,.08),
        inset 0 0 15px rgba(255,255,255,.15);
}

.gear::before{
    content:"";
    position:absolute;
    inset:20%;
    border-radius:50%;
    background:#111827;
    box-shadow:inset 0 0 10px rgba(0,0,0,.8);
}

/* Teeth */
.teeth{
    position:absolute;
    inset:-8px;
}

.tooth{
    position:absolute;
    width:10px;
    height:18px;
    background:#9ca3af;
    left:50%;
    top:50%;
    margin-left:-5px;
    margin-top:-9px;
    border-radius:2px;
    transform-origin:center center;
}

/* Sizes */
.large{
    width:90px;
    height:90px;
    left:15px;
    top:55px;
    animation:spin 8s linear infinite;
}

.medium{
    width:65px;
    height:65px;
    left:95px;
    top:15px;
    animation:spin-reverse 6s linear infinite;
}

.small{
    width:45px;
    height:45px;
    left:150px;
    top:78px;
    animation:spin 5s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes spin-reverse{
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
}

.title{
    margin-top:25px;
    font-size:1.8rem;
    font-weight:600;
    letter-spacing:1px;
}

.subtitle{
    margin-top:8px;
    color:#9ca3af;
    font-size:.9rem;
}

.dots::after{
    content:"";
    animation:dots 2s infinite;
}

@keyframes dots{
    0%{content:"";}
    33%{content:".";}
    66%{content:"..";}
    100%{content:"...";}
}
</style>
</head>
<body>

<div class="container">

    <div class="gear-system">

        <div class="gear large">
            <div class="teeth">
                <div class="tooth" style="transform:rotate(0deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(30deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(60deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(90deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(120deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(150deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(180deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(210deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(240deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(270deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(300deg) translateY(-52px)"></div>
                <div class="tooth" style="transform:rotate(330deg) translateY(-52px)"></div>
            </div>
        </div>

        <div class="gear medium">
            <div class="teeth">
                <div class="tooth" style="transform:rotate(0deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(45deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(90deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(135deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(180deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(225deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(270deg) translateY(-38px)"></div>
                <div class="tooth" style="transform:rotate(315deg) translateY(-38px)"></div>
            </div>
        </div>

        <div class="gear small">
            <div class="teeth">
                <div class="tooth" style="transform:rotate(0deg) translateY(-28px)"></div>
                <div class="tooth" style="transform:rotate(60deg) translateY(-28px)"></div>
                <div class="tooth" style="transform:rotate(120deg) translateY(-28px)"></div>
                <div class="tooth" style="transform:rotate(180deg) translateY(-28px)"></div>
                <div class="tooth" style="transform:rotate(240deg) translateY(-28px)"></div>
                <div class="tooth" style="transform:rotate(300deg) translateY(-28px)"></div>
            </div>
        </div>

    </div>

    <div class="title">Maintenance Break</div>
    <div class="subtitle">
        We’ll be back shortly<span class="dots"></span>
    </div>

</div>

</body>
</html>
