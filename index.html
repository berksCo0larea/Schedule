<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Schedule</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; padding: 16px; }
  .app { max-width: 480px; margin: 0 auto; }
  .header { margin-bottom: 16px; }
  .school-name { font-size: 11px; color: #888; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 2px; }
  .app-title { font-size: 26px; font-weight: 600; color: #111; }
  .time-display { font-size: 13px; color: #888; text-align: right; margin-bottom: 14px; }
  .current-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 20px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .current-card .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .current-card .inner { padding-left: 12px; }
  .period-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .class-name { font-size: 22px; font-weight: 600; color: #111; margin-bottom: 4px; }
  .teacher { font-size: 14px; color: #888; margin-bottom: 14px; }
  .time-row { display: flex; align-items: center; gap: 20px; }
  .countdown { font-size: 28px; font-weight: 600; color: #111; }
  .countdown-label { font-size: 12px; color: #aaa; }
  .time-badge { font-size: 13px; color: #888; display: flex; align-items: center; gap: 5px; }
  .progress-bar { height: 4px; background: #f0f0f0; border-radius: 2px; margin-top: 16px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 1s linear; }
  .next-card { background: #fff; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #e5e5e5; }
  .next-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .next-class { font-size: 15px; font-weight: 600; color: #111; }
  .next-time { font-size: 13px; color: #888; }
  .day-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .day-tab { padding: 7px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; border: 1px solid #e5e5e5; cursor: pointer; white-space: nowrap; background: #fff; color: #888; }
  .day-tab.active { background: #111; color: #fff; border-color: #111; }
  .schedule-list { display: flex; flex-direction: column; gap: 6px; }
  .period-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; }
  .period-row.active-row { border-color: #ccc; background: #fafafa; }
  .period-row.past-row { opacity: 0.4; }
  .period-num { width: 26px; height: 26px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #888; flex-shrink: 0; }
  .period-num.active-num { background: #111; color: #fff; }
  .period-info { flex: 1; min-width: 0; }
  .period-class { font-size: 14px; font-weight: 600; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .period-teacher { font-size: 12px; color: #aaa; }
  .period-time { font-size: 12px; color: #bbb; white-space: nowrap; flex-shrink: 0; }
  .room-badge { font-size: 11px; color: #aaa; background: #f5f5f5; border-radius: 6px; padding: 2px 7px; flex-shrink: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .no-school { text-align: center; padding: 40px 20px; color: #aaa; font-size: 15px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="school-name">P.S./I.S. 104 · Grade 6 · Class 601</div>
    <div class="app-title">My Schedule</div>
  </div>
  <div class="time-display" id="clock"></div>
  <div id="current-section"></div>
  <div id="next-section"></div>
  <div class="day-tabs" id="day-tabs"></div>
  <div class="schedule-list" id="schedule-list"></div>
</div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const schedule = {
  Monday: [
    {p:1,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'8:20',end:'9:05'},
    {p:2,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'9:05',end:'9:50'},
    {p:3,name:'Electives',teacher:'Petrizzo',room:'208',start:'9:50',end:'10:35'},
    {p:4,name:'Chorus 6',teacher:'Castine',room:'308',start:'10:35',end:'11:20'},
    {p:5,name:'Core Social Studies',teacher:'Petrizzo',room:'208',start:'11:20',end:'12:05'},
    {p:6,name:'Lunch 6',teacher:'Fernandez',room:'CAF',start:'12:05',end:'12:50'},
    {p:7,name:'Physical Education',teacher:'Dibbs',room:'GYM',start:'12:50',end:'13:35'},
    {p:8,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'13:35',end:'14:20'},
  ],
  Tuesday: [
    {p:1,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'8:20',end:'9:05'},
    {p:2,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'9:05',end:'9:50'},
    {p:3,name:'Electives',teacher:'Petrizzo',room:'208',start:'9:50',end:'10:35'},
    {p:4,name:'Chorus 6',teacher:'Castine',room:'308',start:'10:35',end:'11:20'},
    {p:5,name:'Core Social Studies',teacher:'Petrizzo',room:'208',start:'11:20',end:'12:05'},
    {p:6,name:'Lunch 6',teacher:'Fernandez',room:'CAF',start:'12:05',end:'12:50'},
    {p:7,name:'Physical Education',teacher:'Petrizzo',room:'208',start:'12:50',end:'13:35'},
    {p:8,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'13:35',end:'14:20'},
  ],
  Wednesday: [
    {p:1,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'8:20',end:'9:05'},
    {p:2,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'9:05',end:'9:50'},
    {p:3,name:'Elective',teacher:'Petrizzo',room:'208',start:'9:50',end:'10:35'},
    {p:4,name:'Technology 6',teacher:'Logozzo',room:'208',start:'10:35',end:'11:20'},
    {p:5,name:'Core Science 6',teacher:'Petrizzo',room:'208',start:'11:20',end:'12:05'},
    {p:6,name:'Lunch 6',teacher:'Fernandez',room:'CAF',start:'12:05',end:'12:50'},
    {p:7,name:'Physical Education',teacher:'Petrizzo',room:'208',start:'12:50',end:'13:35'},
    {p:8,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'13:35',end:'14:20'},
  ],
  Thursday: [
    {p:1,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'8:20',end:'9:05'},
    {p:2,name:'Health 6',teacher:'Petrizzo',room:'208',start:'9:05',end:'9:50'},
    {p:3,name:'Electives',teacher:'Petrizzo',room:'208',start:'9:50',end:'10:35'},
    {p:4,name:'Civics For All',teacher:'Zera',room:'208',start:'10:35',end:'11:20'},
    {p:5,name:'Core Science 6',teacher:'Petrizzo',room:'208',start:'11:20',end:'12:05'},
    {p:6,name:'Lunch 6',teacher:'Fernandez',room:'CAF',start:'12:05',end:'12:50'},
    {p:7,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'12:50',end:'13:35'},
    {p:8,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'13:35',end:'14:20'},
  ],
  Friday: [
    {p:1,name:'Core ELA 6',teacher:'Petrizzo',room:'208',start:'8:20',end:'9:05'},
    {p:2,name:'Health 6',teacher:'Petrizzo',room:'208',start:'9:05',end:'9:50'},
    {p:3,name:'Spanish 6',teacher:'Scandole',room:'208',start:'9:50',end:'10:35'},
    {p:4,name:'Core Social Studies',teacher:'Petrizzo',room:'208',start:'10:35',end:'11:20'},
    {p:5,name:'Core Science 6',teacher:'Petrizzo',room:'208',start:'11:20',end:'12:05'},
    {p:6,name:'Lunch 6',teacher:'Fernandez',room:'CAF',start:'12:05',end:'12:50'},
    {p:7,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'12:50',end:'13:35'},
    {p:8,name:'Core Math 6',teacher:'Petrizzo',room:'208',start:'13:35',end:'14:20'},
  ],
};
const COLORS = ['#7F77DD','#1D9E75','#D85A30','#D4537E','#378ADD','#639922','#BA7517','#E24B4A'];
let selectedDay = null;
function getNYTime() { return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})); }
function getDayName(d) { return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]; }
function fmt12(t) { const [h,m]=t.split(':').map(Number); const ampm=h>=12?'PM':'AM'; const h12=h%12||12; return `${h12}:${String(m).padStart(2,'0')} ${ampm}`; }
function fmtCountdown(secs) { if(secs<=0)return'0:00'; const m=Math.floor(secs/60); const s=secs%60; return `${m}:${String(s).padStart(2,'0')}`; }
function getCurrentPeriod(day,now) { const nowMins=now.getHours()*60+now.getMinutes(); if(!schedule[day])return null; for(const p of schedule[day]){if(nowMins>=toMins(p.start)&&nowMins<toMins(p.end))return p;} return null; }
function getNextPeriod(day,now) { const nowMins=now.getHours()*60+now.getMinutes(); if(!schedule[day])return null; for(const p of schedule[day]){if(toMins(p.start)>nowMins)return p;} return null; }
function render() {
  const now = getNYTime();
  const realDay = getDayName(now);
  const isSchoolDay = DAYS.includes(realDay);
  const viewDay = selectedDay || (isSchoolDay ? realDay : 'Monday');
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${fmt12(hh+':'+mm)} · ${realDay}`;
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = DAYS.map(d=>`<div class="day-tab${viewDay===d?' active':''}" onclick="selectDay('${d}')">${d.slice(0,3)}</div>`).join('');
  const dayPeriods = schedule[viewDay]||[];
  const isToday = viewDay===realDay && isSchoolDay;
  const cur = isToday ? getCurrentPeriod(viewDay,now) : null;
  const nxt = isToday ? getNextPeriod(viewDay,now) : null;
  const curSec = document.getElementById('current-section');
  const nxtSec = document.getElementById('next-section');
  if(!isToday){ curSec.innerHTML=''; nxtSec.innerHTML=''; }
  else if(cur){
    const endMins=toMins(cur.end);
    const nowMins=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
    const startMins=toMins(cur.start);
    const totalMins=endMins-startMins;
    const elapsed=nowMins-startMins;
    const pct=Math.min(100,Math.max(0,(elapsed/totalMins)*100));
    const secsLeft=Math.max(0,(endMins-nowMins)*60);
    const color=COLORS[(cur.p-1)%COLORS.length];
    curSec.innerHTML=`<div class="current-card"><div class="accent" style="background:${color}"></div><div class="inner"><div class="period-label"><span class="dot"></span>Period ${cur.p} · now</div><div class="class-name">${cur.name}</div><div class="teacher">${cur.teacher} · Room ${cur.room}</div><div class="time-row"><div><div class="countdown">${fmtCountdown(Math.round(secsLeft))}</div><div class="countdown-label">until end</div></div><div class="time-badge">${fmt12(cur.start)} – ${fmt12(cur.end)}</div></div><div class="progress-bar"><div class="progress-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div></div></div>`;
  } else {
    const nowMins=now.getHours()*60+now.getMinutes();
    const firstStart=toMins(dayPeriods[0]?.start||'8:20');
    if(nowMins<firstStart){ curSec.innerHTML=`<div class="current-card"><div style="padding:4px"><div class="period-label">school hasn't started yet</div><div class="class-name">First period at ${fmt12(dayPeriods[0]?.start||'8:20')}</div></div></div>`; }
    else { curSec.innerHTML=`<div class="current-card"><div style="padding:4px"><div class="period-label">school is done for today 🎉</div><div class="class-name">See you tomorrow!</div></div></div>`; }
  }
  if(isToday&&nxt){ nxtSec.innerHTML=`<div class="next-card"><div><div class="next-label">up next · Period ${nxt.p}</div><div class="next-class">${nxt.name}</div></div><div class="next-time">${fmt12(nxt.start)}</div></div>`; }
  else { nxtSec.innerHTML=''; }
  const nowMins=now.getHours()*60+now.getMinutes();
  const list=document.getElementById('schedule-list');
  list.innerHTML=dayPeriods.map(p=>{
    const isPast=isToday&&toMins(p.end)<=nowMins;
    const isActive=isToday&&cur&&cur.p===p.p;
    return `<div class="period-row${isActive?' active-row':isPast?' past-row':''}"><div class="period-num${isActive?' active-num':''}">${p.p}</div><div class="period-info"><div class="period-class">${p.name}</div><div class="period-teacher">${p.teacher}</div></div><div class="room-badge">Rm ${p.room}</div><div class="period-time">${fmt12(p.start)}</div>${isActive?'<div class="dot"></div>':''}</div>`;
  }).join('');
}
window.selectDay = function(d){ selectedDay=d; render(); };
render();
setInterval(render,1000);
</script>
</body>
</html>
